name: Scientific workstream coordination policy

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "scientific-portfolio-governance/**"
      - ".github/workflows/scientific-portfolio-governance.yml"
  push:
    branches: ["main"]
    paths:
      - "AGENTS.md"
      - "scientific-portfolio-governance/**"
      - ".github/workflows/scientific-portfolio-governance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate lightweight coordination surface
        shell: bash
        run: |
          set -euo pipefail
          test -f scientific-portfolio-governance/SKILL.md
          test -f scientific-portfolio-governance/AGENTS.md
          test -f scientific-portfolio-governance/references/workstream-marker.md
          grep -Fiq "No checked-in portfolio board" scientific-portfolio-governance/SKILL.md
          grep -Fiq "one writer" scientific-portfolio-governance/SKILL.md
          grep -Fiq "No successor activates automatically" scientific-portfolio-governance/SKILL.md
          test ! -e scientific-portfolio-governance/scripts/validate_portfolio.py
          test ! -e scientific-portfolio-governance/scripts/test_validate_portfolio.py
          test ! -e scientific-portfolio-governance/references/portfolio-schema.md

      - name: Check complete diff whitespace
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$PUSH_BEFORE"
          fi
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^)"
          fi
          git diff --check "$base"...HEAD
