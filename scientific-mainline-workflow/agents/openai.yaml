interface:
  display_name: "Scientific Mainline Workflow"
  short_description: "Scope evidence proportionally, iterate, review, validate, and freeze"
  default_prompt: "Use $scientific-mainline-workflow. Before construction, read references/evidence-scope-ladder.md and declare the checkpoint's evidence, quantifier, and stability levels plus NEED/SHOULD/COULD burdens. Use the weakest honest quantifier and minimum sufficient proof burden; do not promote global regularity, all-configuration stability, exhaustive diagnostics, or deeper-theory derivation into blockers unless the maintained claim, user steering, or a proved dependency requires them. Develop on an issue-scoped feature branch and commit and push coherent non-decisive work. Keep decision-bearing predicates, tolerances, comparator code, and source bindings uncommitted until adversarial review accepts their exact mutable bytes; their first commit must be the joint freeze commit. Validate proportionally and integrate only the reviewed freeze onto synchronized main. When required deterministic Python validation cannot run locally, follow references/github-actions-python-fallback.md and bind the CI run to the exact tested commit; CI success is process evidence, not theorem authority or a scientific verdict."
