interface:
  display_name: "Scientific Mainline Workflow"
  short_description: "Scope evidence proportionally, iterate, review, and freeze"
  default_prompt: "Use $scientific-mainline-workflow. Before construction, read references/evidence-scope-ladder.md and declare the checkpoint's evidence, quantifier, and stability levels plus NEED/SHOULD/COULD burdens. Use the weakest honest quantifier and minimum sufficient proof burden; do not promote global regularity, all-configuration stability, exhaustive diagnostics, or deeper-theory derivation into blockers unless the maintained claim, user steering, or a proved dependency requires them. Develop on a pushed issue-scoped feature branch, bind independent review to exact candidate bytes and the selected NEED set, validate proportionally, and integrate only the reviewed freeze onto synchronized main."